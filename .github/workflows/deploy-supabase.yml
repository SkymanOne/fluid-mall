# Deploys every Edge Function to the hosted Supabase project when function code lands on main.
# Function secrets (XAI, TypeSafe, Tavily keys) are set once with `just compose-deploy` and stay on Supabase.
# Needs repo secrets SUPABASE_ACCESS_TOKEN (a Supabase personal access token) and SUPABASE_PROJECT_ID.
name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --use-api
